# 行为树仿真配置（供 sim_feedback.py 读取；run_real_bt.py 纯真实、不读本文件）。
# interfaces.<name>.simulate:
#   true  = 该接口由 sim_feedback（独立进程）模拟发布/应答（真实节点缺失时的回退）；
#   false = 依赖真实节点提供该话题/服务（标准名不变）。
# LoRa：**话题级仿真**——sim_feedback 注入 /lora/command、观测 /lora/status；
# 串口读取**不仿真**（真实串口由 reference/lora 的 lora_node.py 负责）。
# 接真实地面站时把 lora_command simulate 改为 false，由 lora_node 接管。

interfaces:
  sensor_health:   { simulate: false,  topic: /grasp_hexapod/sensor_health }
  encoder_state:   { simulate: false,  topic: /grasp_hexapod/encoder_state }
  fix:             { simulate: false,  topic: /fix }
  # LoRa 话题级仿真（串口读取不仿真，由真实 lora_node 负责）
  lora_command:    { simulate: false,  topic: /lora/command }
  lora_status:     { simulate: false,  topic: /lora/status }
  remote_cmd:      { simulate: false,  topic: /grasp_hexapod/remote_cmd }
  switch_mode:     { simulate: true,  service: /grasp_hexapod/switch_mode }
  gripper_act:     { simulate: false,  service: /grasp_hexapod/gripper_act }

simulation:
  mission: recover          # 话题级注入的任务命令：RELEASE / RECOVER
  remote_test: ""           # 非空则跑遥控测试链：home|walk|climb|dock|spin_search|release
  # 时间线（秒，仅用于话题级注入时刻：编码器落地/绞盘/恢复初始命令；
  # mode_* 仅 bt_mock_world 使用，sim_feedback 的 switch_mode 不再看它）
  deploy: 7.0
  landing_t: 9.0
  winch_done: 80.0
  home_cmd: 82.0           # 恢复初始命令帧（CMD,HEX,HOME,NOW）
  mode_home: 5.0
  mode_release: 11.0
  mode_spin_search: 13.0
  mode_approach: 24.0      # 接近导航到攀爬点（RTK粗导航+tag精导航）
  mode_climb: 45.0
  mode_dock: 65.0
  # switch_mode 固定延迟：被调用后等待 N 秒返回 service 结果（默认成功；
  # rosparam ~switch_delay 可覆盖）
  switch_delay: 5.0
  # 故障注入（作用于 gripper_act 路径）
  clamp_fail: false         # true → 夹爪 clamp 返回失败（dock 最终 FAILED）
  open_fail: false          # true → 夹爪 open 返回失败（release 最终 FAILED）
  cov_bad_windows: []       # RTK 协方差超限时段，如 "13-16,20-22"

rtk_max_covariance: 0.04    # /fix 协方差阈值（m²）
